<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리의 여행 가계부</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="hero"><label class="import">📄 파일 가져오기<input type="file" id="file" accept=".txt,.csv,.xlsx,.xls,.json,.html,.htm,.pdf" hidden></label></header><nav><label>저장된 여행 <select id="trips"><option value="">여행을 선택하세요</option></select></label><button id="new">＋ 새 여행</button><button id="save">저장</button><button id="backup">백업 내려받기</button></nav><p id="status" role="status">파일을 가져오거나 새 여행을 시작하세요. 저장 내용은 이 브라우저에 보관됩니다.</p><section class="overview"><div><h1 id="title">우리의 여행 기록</h1><p id="dates">여행지와 날짜를 입력해주세요.</p><button id="edit">여행 정보 · 환율 수정</button></div><article class="card"><small>💜 총 지출비용</small><strong id="total">0원</strong><p id="breakdown"></p></article><article class="card"><small>🪙 총 회수비용</small><strong id="recovery">0원</strong><p id="soldcount">판매 완료 0개</p></article></section><section class="columns"><article class="card"><h2>카테고리별 지출</h2><div id="categories"></div><p class="muted">카테고리를 누르면 날짜·항목·금액이 펼쳐져요.</p><button id="add">＋ 지출 추가</button></article><article class="card"><h2>🛍 쇼핑 · 판매 관리</h2><p class="muted">구매처와 상품별로 관리해요. 판매금액 입력 후 확인을 눌러주세요.</p><div id="shopping"></div></article></section><footer><div><small>최종 여행경비</small><strong id="net">0원</strong></div><p id="formula">총 지출비용 − 총 회수비용</p></footer></div><dialog id="metadata"><form id="metaform"><h2>여행 정보</h2><label>여행지<input id="destination" required placeholder="중국 / 일본 / 제주"></label><div class="formgrid"><label>시작일<input id="start" type="date" required></label><label>종료일<input id="end" type="date" required></label></div><div class="formgrid"><label>현지통화<select id="currency"><option value="JPY">엔 (JPY)</option><option value="CNY">위안 (CNY)</option><option value="USD">달러 (USD)</option><option value="EUR">유로 (EUR)</option><option value="KRW">원 (KRW)</option><option value="TWD">대만달러 (TWD)</option><option value="THB">바트 (THB)</option><option value="VND">동 (VND)</option></select></label><label>현지통화 1단위 = 원<input id="rate" type="number" min="0.000001" step="any" required></label></div><p class="muted">환율은 직접 입력해주세요. 파일에 원화 환산액이 있으면 그 금액을 우선 사용합니다.</p><div class="actions"><button type="button" onclick="this.closest('dialog').close()">취소</button><button class="primary">적용 · 저장</button></div></form></dialog><dialog id="entry"><form id="entryform"><h2>지출 내역</h2><label>날짜<input id="edate" type="date" required></label><label>카테고리<select id="ecat"></select></label><label>매장 · 항목<input id="estore" required></label><label>상품명 (쇼핑)<input id="ename" placeholder="상품명을 모르면 비워두세요"></label><div class="formgrid"><label>금액<input id="eamount" type="number" min="0" step="any" required></label><label>통화<select id="ecurrency"></select></label></div><label>수량 (쇼핑은 개별 판매 관리)<input id="eqty" type="number" min="1" max="100" value="1" required></label><div class="actions"><button type="button" onclick="this.closest('dialog').close()">취소</button><button class="primary">저장</button></div></form></dialog><dialog id="preview"><h2>가져온 내역 확인</h2><p id="importnote"></p><div id="previewrows"></div><div class="actions"><button id="cancelimport">취소</button><button id="confirmimport" class="primary">새 여행으로 저장</button></div></dialog><script src="app.js"></script></body></html>
