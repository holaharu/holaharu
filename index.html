<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이북 스타일 웹 소설 뷰어 & PDF 변환기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-viewer: #FDFCF0; 
            --text-viewer: #2B2B2B;
            --bg-ui: #f8f9fa;
            --text-ui: #333333;
            --border-ui: #e0e0e0;
            --accent-color: #4A6572;
        }

        body.theme-sepia { --bg-viewer: #f4ecd8; --text-viewer: #5b4636; }
        body.theme-dark { --bg-viewer: #1e1e1e; --text-viewer: #d4d4d4; --bg-ui: #2d2d2d; --text-ui: #f5f5f5; --border-ui: #444444; }
        body.theme-white { --bg-viewer: #ffffff; --text-viewer: #111111; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-ui);
            color: var(--text-ui);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 🌟 드래그 앤 드롭 시 화면 효과 */
        body.drag-active {
            background-color: #e3f2fd !important;
            border: 4px dashed #2196F3 !important;
        }
        body.drag-active * {
            pointer-events: none; /* 드래그 중 깜빡임 방지 */
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-ui);
            border-right: 1px solid var(--border-ui);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
        }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-size: 13px; font-weight: 600; opacity: 0.8; }
