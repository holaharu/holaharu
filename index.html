<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re-Book v2.0 | Professional Novel Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Noto+Serif+KR:wght@300;400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        /* 1. 디자인 코어 시스템 */
        :root {
            --primary-bg: #FFF3DD;
            --secondary-bg: #FAF6F0;
            --accent-blue: #4A6572;
            --text-main: #333333;
            --text-dim: #666666;
            --dialogue-bg: rgba(74, 101, 114, 0.08); /* 대사 하이라이트 배경 */
            --dialogue-text: #2C3E50;
            --border-color: #3C4043;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #E2E8F0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            font-family: 'Arimo', sans-serif;
            overflow-x: hidden;
        }

        /* 뷰어 전체 컨테이너 */
        .slide-container {
            width: 100%;
            max-width: 1280px;
            height: 90vh;
            background-color: var(--primary-bg);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 40px;
            border-radius: 8px;
        }

        /* 2. 상단 바 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header-bar h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--accent-blue);
        }

        .nav-controls {
            display: flex;
            gap: 15px;
        }

        .btn-mini {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: transparent;
            font-family: 'Poppins', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-mini:hover {
            background: var(--accent-blue);
            color: white;
        }

        /* 3. 업로드 뷰 (초기 화면) */
        #upload-view {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 30px;
        }

        .dropzone {
            width: 100%;
            max-width: 600px;
            height: 300px;
            border: 2px dashed var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: var(--transition);
        }

        .dropzone.drag-active {
            background: rgba(74, 101, 114, 0.1);
            transform: scale(1.02);
        }

        /* 4. 리더 뷰 (소설 감상 모드) */
        #reader-view {
            display: none; /* 초기엔 숨김 */
            flex-grow: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #viewer-content {
            background-color: var(--secondary-bg);
            border: 1px solid var(--border-color);
            padding: 60px;
            overflow-y: auto;
            flex-grow: 1;
            font-family: 'Noto Serif KR', serif;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-main);
            text-align: justify;
            white-space: pre-wrap;
        }

        /* 5. 대사 하이라이트 스타일 */
        .dialogue {
            background-color: var(--dialogue-bg);
            color: var(--dialogue-text);
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 400;
        }

        /* 6. PDF 출력 전용 스타일 (잘림 방지) */
        @media print {
            .btn-mini, .header-bar, .sidebar { display: none !important; }
            #viewer-content {
                width: 100%;
                height: auto;
                padding: 0;
                border: none;
                background: white;
            }
            .novel-section {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>

<div class="slide-container" id="main-slide">
    <div class="header-bar">
        <h1>RE-BOOK <span style="font-weight:300">V2.0</span></h1>
        <div class="nav-controls" id="viewer-nav" style="display:none;">
            <button class="btn-mini" onclick="resetViewer()">파일 교체</button>
            <button class="btn-mini" onclick="cleanText()">태그 싹 지우기</button>
            <button class="btn-mini" onclick="exportPDF()" style="background:var(--accent-blue); color:white; border:none;">PDF 저장</button>
        </div>
    </div>

    <div id="upload-view">
        <h2 style="font-family:'Poppins'; font-size:32px; margin-bottom:10px;">텍스트 파일을 올려주세요</h2>
        
        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
            <p style="font-family:'Poppins'; font-weight:500; font-size:18px;">클릭하거나 파일을 드래그해서 놓으세요 (.txt)</p>
            <input type="file" id="fileInput" accept=".txt" style="display:none;">
        </div>
    </div>

    <div id="reader-view">
        <div id="viewer-content"></div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const uploadView = document.getElementById('upload-view');
    const readerView = document.getElementById('reader-view');
    const viewerContent = document.getElementById('viewer-content');
    const viewerNav = document.getElementById('viewer-nav');

    let rawText = "";

    // 1. 파일 업로드 기능
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('drag-active');
    });

    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-active'));

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('drag-active');
        handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
        if (!file || !file.name.endsWith('.txt')) {
            alert("유효한 .txt 파일을 선택해주세요.");
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            rawText = e.target.result;
            renderText(rawText);
            switchToViewer();
        };
        reader.readAsText(file, "UTF-8");
    }

    // 2. 뷰어에 텍스트 띄우기 & 대사 하이라이트
    function renderText(text) {
        // " " 또는 『 』 또는 「 」 안에 있는 대사를 찾아 배경색 입히기
        let formattedText = text
            .replace(/"([^"]*)"/g, '<span class="dialogue">"$1"</span>')
            .replace(/『([^』]*)』/g, '<span class="dialogue">『$1』</span>')
            .replace(/「([^」]*)」/g, '<span class="dialogue">「$1」</span>');

        // PDF로 뺄 때 중간에 잘리지 않도록 문단 단위로 묶어주기
        const paragraphs = formattedText.split('\n');
        viewerContent.innerHTML = paragraphs
            .map(p => p.trim() ? `<div class="novel-section">${p}</div>` : '<br>')
            .join('');
    }

    function switchToViewer() {
        uploadView.style.display = 'none';
        readerView.style.display = 'flex';
        viewerNav.style.display = 'flex';
    }

    function resetViewer() {
        uploadView.style.display = 'flex';
        readerView.style.display = 'none';
        viewerNav.style.display = 'none';
        fileInput.value = "";
    }

    // 3. 태그 정제 (</psyche>, <img=> 등 지우기)
    function cleanText() {
        let currentText = viewerContent.innerText;
        currentText = currentText.replace(/<[^>]+>/g, ""); // 모든 꺾쇠 태그 제거
        currentText = currentText.replace(/허가됨/g, ""); // '허가됨' 단어 제거
        
        renderText(currentText);
        alert("태그가 깔끔하게 정리되었습니다!");
    }

    // 4. PDF 저장 (잘림 방지)
    function exportPDF() {
        const element = document.getElementById('viewer-content');
        const opt = {
            margin: [20, 20, 20, 20],
            filename: 'Novel_Export.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
        };

        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
