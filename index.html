<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이북 스타일 웹 소설 뷰어 & PDF 변환기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-viewer: #FDFCF0; 
            --text-viewer: #2B2B2B;
            --bg-ui: #f8f9fa;
            --text-ui: #333333;
            --border-ui: #e0e0e0;
            --accent-color: #4A6572;
        }

        body.theme-sepia { --bg-viewer: #f4ecd8; --text-viewer: #5b4636; }
        body.theme-dark { --bg-viewer: #1e1e1e; --text-viewer: #d4d4d4; --bg-ui: #2d2d2d; --text-ui: #f5f5f5; --border-ui: #444444; }
        body.theme-white { --bg-viewer: #ffffff; --text-viewer: #111111; }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-ui);
            color: var(--text-ui);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 🌟 드래그 앤 드롭 시 화면 효과 */
        body.drag-active {
            background-color: #e3f2fd !important;
            border: 4px dashed #2196F3 !important;
        }
        body.drag-active * {
            pointer-events: none; /* 드래그 중 깜빡임 방지 */
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-ui);
            border-right: 1px solid var(--border-ui);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            z-index: 10;
        }

        .sidebar h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
        }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-size: 13px; font-weight: 600; opacity: 0.8; }
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .btn-theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }

        button, label.file-label {
            background-color: #ffffff; color: #333333; border: 1px solid var(--border-ui);
            padding: 10px; font-size: 13px; font-weight: 500; border-radius: 6px;
            cursor: pointer; text-align: center; transition: all 0.2s;
        }

        body.theme-dark button { background-color: #3a3a3a; color: #ffffff; border-color: #555555; }
        button:hover, label.file-label:hover { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }

        .btn-primary { background-color: var(--accent-color) !important; color: white !important; font-weight: 600; border: none; }
        .btn-danger { background-color: #e53935 !important; color: white !important; border: none; }
        
        input[type="file"] { display: none; }
        input[type="text"] {
            padding: 10px; border: 1px solid var(--border-ui); border-radius: 6px;
            font-size: 13px; background-color: #fff; color: #333;
        }
        body.theme-dark input[type="text"] { background-color: #3a3a3a; color: #fff; border-color: #555555; }

        .viewer-master {
            flex: 1; overflow-y: auto; padding: 40px 20px;
            display: flex; justify-content: center; background-color: #e9ecef;
        }
        body.theme-dark .viewer-master { background-color: #121212; }

        #viewer-container {
            background-color: var(--bg-viewer); color: var(--text-viewer);
            width: 100%; max-width: 720px; min-height: 100%;
            padding: 50px 45px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-radius: 4px;
            
            font-family: 'Noto Serif KR', serif; font-size: 16px; line-height: 1.85;
            text-align: justify; word-break: keep-all; white-space: pre-wrap;
        }

        .placeholder-text {
            font-family: 'Noto Sans KR', sans-serif !important; text-align: center !important;
            color: #888; margin-top: 100px; font-size: 15px; line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>📂 파일 업로드</h2>
            <div class="control-group" style="margin-top:10px;">
                <label for="fileInput" class="file-label">📄 파일 선택 (또는 드래그 앤 드롭)</label>
                <input type="file" id="fileInput" accept=".txt">
                <div id="fileNameDisplay" style="font-size:12px; text-align:center; opacity:0.7; margin-top:5px; word-break:break-all;">선택된 파일 없음</div>
            </div>
        </div>

        <div>
            <h2>🧹 텍스트 정제 (제외/삭제)</h2>
            <div class="control-group" style="margin-top:10px; gap:10px;">
                <button class="btn-danger" onclick="cleanScriptTags()">🚫 시스템 태그 일괄 삭제</button>
                <span style="font-size:11px; opacity:0.6; margin-top:-5px; padding-left:2px;">(&lt;img=...&gt;, &lt;/psyche&gt; 등 제거)</span>
                
                <div class="control-group" style="margin-top:5px;">
                    <label>특정 문구 강제 삭제</label>
                    <input type="text" id="customRemoveInput" placeholder="예: 허가됨">
                    <button onclick="cleanCustomWord()">✏️ 입력 문구 일괄 삭제</button>
                </div>
            </div>
        </div>

        <div>
            <h2>🎨 보기 설정</h2>
            <div class="control-group" style="margin-top:10px; gap:12px;">
                <div class="control-group">
                    <label>화면 테마</label>
                    <div class="btn-theme-grid">
                        <button onclick="changeTheme('paper')" style="background:#FDFCF0; color:#2B2B2B; font-size:11px; padding:5px 0;">미색</button>
                        <button onclick="changeTheme('white')" style="background:#ffffff; color:#111111; font-size:11px; padding:5px 0;">화이트</button>
                        <button onclick="changeTheme('sepia')" style="background:#f4ecd8; color:#5b4636; font-size:11px; padding:5px 0;">세피아</button>
                        <button onclick="changeTheme('dark')" style="background:#1e1e1e; color:#d4d4d4; font-size:11px; padding:5px 0;">다크</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>글자 크기</label>
                    <div class="btn-grid">
                        <button onclick="adjustFontSize(1)">글자 크게 A+</button>
                        <button onclick="adjustFontSize(-1)">글자 작게 A-</button>
                    </div>
                </div>
            </div>
        </div>

        <div style="margin-top: auto; padding-top: 20px;">
            <h2>💾 내보내기</h2>
            <button class="btn-primary" onclick="exportToPDF()" style="width:100%; height:45px; font-size:14px;">🖨️ 깔끔한 PDF로 출력</button>
        </div>
    </div>

    <div class="viewer-master">
        <div id="viewer-container">
            <div class="placeholder-text">
                <span style="font-size: 24px;">📥</span><br><br>
                <strong>화면 아무 곳에나 TXT 파일을 끌어다 놓으세요!</strong><br><br>
                왼쪽 메뉴에서 버튼을 눌러 업로드해도 됩니다.<br>
                교보문고 이북 스타일의 레이아웃으로 즉시 변환됩니다.
            </div>
        </div>
    </div>

    <script>
        let originalText = ""; 
        let currentFontSize = 16;
        const viewer = document.getElementById('viewer-container');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const fileInput = document.getElementById('fileInput');

        // 🌟 [핵심] 파일을 읽어서 화면에 띄우는 공통 함수
        function processFile(file) {
            if (!file) return;
            
            // TXT 파일인지 확인
            if (!file.name.toLowerCase().endsWith('.txt')) {
                alert("TXT 형식의 텍스트 파일만 업로드 가능합니다!");
                return;
            }

            fileNameDisplay.textContent = "📖 " + file.name;

            const reader = new FileReader();
            reader.onload = function(event) {
                originalText = event.target.result;
                viewer.innerHTML = ""; // 기존 안내 문구 완전 삭제
                viewer.textContent = originalText;
            };
            
            reader.readAsText(file, "UTF-8");
        }

        // 1. 버튼으로 파일 선택 시 작동
        fileInput.addEventListener('change', function(e) {
            processFile(e.target.files[0]);
            e.target.value = ''; // 동일한 파일을 다시 올려도 인식하도록 초기화
        });

        // 2. 🌟 드래그 앤 드롭 (Drag & Drop) 기능 세팅
        document.body.addEventListener('dragover', function(e) {
            e.preventDefault(); 
            document.body.classList.add('drag-active'); // 화면 색상 변경
        });

        document.body.addEventListener('dragleave', function(e) {
            e.preventDefault();
            document.body.classList.remove('drag-active'); // 화면 색상 원상복구
        });

        document.body.addEventListener('drop', function(e) {
            e.preventDefault();
            document.body.classList.remove('drag-active');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processFile(files[0]); // 드롭한 파일 처리
            }
        });

        // 3. 시스템 태그 정규식 제거
        function cleanScriptTags() {
            if (!originalText) { alert("먼저 파일을 업로드해주세요!"); return; }
            let text = viewer.textContent;
            text = text.replace(/<[^>]+>/g, ""); // 꺾쇠 태그 삭제
            text = text.replace(/\n\s*\n\s*\n/g, "\n\n"); // 여백 압축
            viewer.textContent = text;
            alert("시스템 태그가 깔끔하게 제거되었습니다!");
        }

        // 4. 커스텀 단어 삭제
        function cleanCustomWord() {
            if (!originalText) { alert("먼저 파일을 업로드해주세요!"); return; }
            const targetWord = document.getElementById('customRemoveInput').value.trim();
            if (!targetWord) { alert("삭제할 문구를 입력해 주세요!"); return; }

            let text = viewer.textContent;
            const escapedWord = targetWord.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const regex = new RegExp(escapedWord, 'g');
            text = text.replace(regex, "");
            viewer.textContent = text;
            
            alert(`'${targetWord}' 문구가 삭제되었습니다.`);
            document.getElementById('customRemoveInput').value = "";
        }

        // 5. 기타 UI 제어 (테마, 글자 크기, PDF 출력)
        function changeTheme(theme) {
            document.body.className = '';
            if (theme !== 'paper') document.body.classList.add('theme-' + theme);
        }

        function adjustFontSize(value) {
            currentFontSize += value;
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 30) currentFontSize = 30;
            viewer.style.fontSize = currentFontSize + 'px';
        }

        function exportToPDF() {
            if (!originalText || viewer.querySelector('.placeholder-text')) {
                alert("내보낼 텍스트가 없습니다."); return;
            }

            const opt = {
                margin: 15, filename: 'novel_viewer.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, scrollY: 0, backgroundColor: getComputedStyle(viewer).backgroundColor },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const targetBtn = event.target;
            const originalBtnText = targetBtn.textContent;
            targetBtn.textContent = "⏳ PDF 변환 중..."; targetBtn.disabled = true;

            html2pdf().set(opt).from(viewer).save().then(() => {
                targetBtn.textContent = originalBtnText; targetBtn.disabled = false;
            });
        }
    </script>
</body>
</html>
