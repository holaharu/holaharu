<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고품격 웹 소설 리더 & PDF 변환기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* 디자인 변수 정의 */
        :root {
            --bg-viewer: #FDFCF0; 
            --text-viewer: #2B2B2B;
            --bg-ui: #f8f9fa;
            --text-ui: #333333;
            --border-ui: #e0e0e0;
            --accent-color: #4A6572;
            --dialogue-bg: rgba(74, 101, 114, 0.06);
            --dialogue-text: #1A252C;
        }

        body.theme-white { --bg-viewer: #ffffff; --text-viewer: #111111; --dialogue-bg: #f1f3f5; }
        body.theme-sepia { --bg-viewer: #f4ecd8; --text-viewer: #5b4636; --dialogue-bg: rgba(91, 70, 54, 0.07); }
        body.theme-dark {
            --bg-viewer: #1e1e1e; --text-viewer: #d4d4d4;
            --bg-ui: #2d2d2d; --text-ui: #f5f5f5; --border-ui: #444444;
            --dialogue-bg: rgba(255,255,255,0.08); --dialogue-text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-ui);
            color: var(--text-ui);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 초기 업로드 대기 화면 */
        #upload-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #FDFCF0; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .dropzone {
            width: 90%; max-width: 600px; height: 320px;
            border: 3px dashed #4A6572; border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.7); cursor: pointer; transition: all 0.2s;
        }
        .dropzone:hover, .dropzone.drag-active {
            background: rgba(74, 101, 114, 0.1); transform: scale(1.01);
        }
        .dropzone i { font-size: 64px; color: var(--accent-color); margin-bottom: 20px; }
        .dropzone p { font-size: 18px; font-weight: 500; color: #4A6572; text-align: center; line-height: 1.6; }

        /* 메인 레이아웃 */
        #main-layout { display: none; width: 100%; height: 100%; }
        
        .sidebar {
            width: 340px; background-color: var(--bg-ui); border-right: 1px solid var(--border-ui);
            padding: 25px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 15px; font-weight: 700; color: var(--accent-color);
            border-bottom: 2px solid var(--accent-color); padding-bottom: 6px; margin-bottom: 10px;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .control-group label { font-size: 12px; font-weight: 600; opacity: 0.8; }
        
        button, label.file-change-label {
            background-color: #ffffff; color: #333333; border: 1px solid var(--border-ui);
            padding: 10px; font-size: 13px; font-weight: 500; border-radius: 6px;
            cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        button:hover, label.file-change-label:hover { background-color: #eee; }
        .btn-primary { background-color: var(--accent-color) !important; color: white !important; border: none; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .rule-row { display: flex; gap: 4px; margin-bottom: 4px; }
        .rule-row input {
            width: 45%; padding: 6px; border: 1px solid var(--border-ui);
            border-radius: 4px; font-size: 12px; background: #fff; color: #333;
        }
        .btn-del-rule { width: 10%; padding: 6px; background: #ffebee; color: #c62828; border: none; cursor: pointer; }

        /* 리더 뷰어 영역 */
        .viewer-master { 
            flex: 1; overflow-y: auto; background-color: #e9ecef; 
            text-align: center; padding: 40px 20px;
        }
        body.theme-dark .viewer-master { background-color: #121212; }
        
        #viewer-container {
            display: inline-block; text-align: left; 
            background-color: var(--bg-viewer); color: var(--text-viewer);
            width: 100%; max-width: 760px; height: auto;
            padding: 60px 50px; box-shadow: 0 4px 25px rgba(0,0,0,0.07); border-radius: 4px;
            
            font-family: 'Noto Serif KR', serif; font-size: 16px; line-height: 1.9;
            text-align: justify; word-break: keep-all; white-space: pre-wrap;
        }

        .dialogue-line {
            background-color: var(--dialogue-bg);
            color: var(--dialogue-text);
            padding: 4px 10px; margin: 6px 0; border-radius: 6px;
            border-left: 3px solid var(--accent-color);
            display: block;
        }

        /* 인쇄(PDF) 전용 스타일 */
        @media print {
            @page { size: A4 portrait; margin: 25mm 20mm; }
            body, html { height: auto !important; background: white !important; color: black !important; overflow: visible !important; }
            .sidebar { display: none !important; }
            .viewer-master { display: block !important; padding: 0 !important; background: white !important; overflow: visible !important; height: auto !important; }
            #viewer-container {
                display: block !important; box-shadow: none !important; padding: 0 !important; 
                max-width: 100% !important; width: 100% !important; 
                background: white !important; color: black !important;
                font-size: 11pt !important; line-height: 1.7 !important;
            }
            .novel-paragraph { page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 0.8em !important; text-indent: 1em !important; text-align: justify !important; }
            .dialogue-line { background: none !important; border-left: none !important; padding: 0 !important; margin: 0.8em 0 !important; color: black !important; font-weight: normal !important; text-indent: 1em !important; }
        }
    </style>
</head>
<body>

    <div id="upload-container">
        <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-book-open"></i>
            <p><strong>TXT 소설 파일을 이곳에 드래그하거나 클릭하세요.</strong><br><span style="font-size:14px; color:#777; font-weight:normal;">배경 잘림 없는 웹 뷰어 및 책 형태의 PDF로 자동 변환됩니다.</span></p>
            <input type="file" id="fileInput" accept=".txt" style="display:none;">
        </div>
    </div>

    <div id="main-layout">
        <div class="sidebar">
            <div>
                <h2>🔄 파일 교체</h2>
                <label for="fileInput2" class="file-change-label"><i class="fa-solid fa-arrows-rotate"></i> 다른 파일 불러오기</label>
                <input type="file" id="fileInput2" accept=".txt" style="display:none;">
                <div id="currentFileName" style="font-size:12px; text-align:center; opacity:0.6; margin-top:6px; word-break:break-all;"></div>
            </div>

            <div>
                <h2>⚙️ 표시 및 정제 옵션</h2>
                <div class="control-group">
                    <button class="btn-primary" style="background-color:#d32f2f !important; font-size:12px;" onclick="cleanSystemTags()">
                        <i class="fa-solid fa-code"></i> ① 이미지/시스템 꺾쇠 태그 삭제
                    </button>
                    <button class="btn-primary" style="background-color:#8e24aa !important; font-size:12px;" onclick="cleanHiddenStory()">
                        <i class="fa-solid fa-eye-slash"></i> ② 히든 스토리 / 스포일러 블록 삭제
                    </button>
                </div>
            </div>

            <div>
                <h2>➕ 커스텀 치환 규칙</h2>
                <div class="control-group">
                    <div id="rulesList">
                        <div class="rule-row">
                            <input type="text" class="rule-find" value="허가됨" placeholder="찾을 단어">
                            <span style="align-self:center; font-size:11px;">→</span>
                            <input type="text" class="rule-replace" value="" placeholder="(공백이면 삭제)">
                        </div>
                    </div>
                    <button onclick="addRuleRow()" style="padding:4px; font-size:12px; margin-top:4px;"><i class="fa-solid fa-plus"></i> 규칙 추가</button>
                    <button class="btn-primary" onclick="applyCustomRules()" style="margin-top:8px;"><i class="fa-solid fa-check"></i> 치환 규칙 일괄 적용</button>
                </div>
            </div>

            <div>
                <h2>🎨 이북 스타일 설정</h2>
                <div class="control-group">
                    <label>화면 테마 색상</label>
                    <div class="grid-4">
                        <button onclick="changeTheme('paper')" style="background:#FDFCF0; color:#2B2B2B; font-size:11px; padding:6px 0;">미색</button>
                        <button onclick="changeTheme('white')" style="background:#ffffff; color:#111111; font-size:11px; padding:6px 0;">화이트</button>
                        <button onclick="changeTheme('sepia')" style="background:#f4ecd8; color:#5b4636; font-size:11px; padding:6px 0;">세피아</button>
                        <button onclick="changeTheme('dark')" style="background:#1e1e1e; color:#d4d4d4; font-size:11px; padding:6px 0;">다크</button>
                    </div>
                </div>
                <div class="control-group">
                    <label>글자 크기 조절 (웹 전용)</label>
                    <div class="grid-2">
                        <button onclick="adjustFontSize(1)"><i class="fa-solid fa-font"></i> 크게 A+</button>
                        <button onclick="adjustFontSize(-1)"><i class="fa-solid fa-font"></i> 작게 A-</button>
                    </div>
                </div>
            </div>

            <div style="margin-top:auto; padding-top:15px;">
                <h2>💾 책 양식으로 내보내기</h2>
                <button class="btn-primary" onclick="window.print()" style="width:100%; height:45px; font-size:14px;"><i class="fa-solid fa-file-pdf"></i> 진짜 책처럼 PDF 인쇄</button>
            </div>
        </div>

        <div class="viewer-master">
            <div id="viewer-container"></div>
        </div>
    </div>

    <script>
        let rawText = ""; 
        let currentFontSize = 16;
        
        const uploadContainer = document.getElementById('upload-container');
        const mainLayout = document.getElementById('main-layout');
        const viewer = document.getElementById('viewer-container');
        const dropzone = document.getElementById('dropzone');
        const currentFileName = document.getElementById('currentFileName');

        function loadTextFile(file) {
            if (!file) return;
            currentFileName.textContent = "현재 도서: " + file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                rawText = e.target.result;
                parseAndRenderText(rawText);
                uploadContainer.style.display = 'none';
                mainLayout.style.display = 'flex';
            };
            reader.readAsText(file, "UTF-8");
        }

        function parseAndRenderText(text) {
            const compressedText = text.replace(/\n\s*\n\s*\n/g, "\n\n");
            const lines = compressedText.split('\n');
            let htmlResult = "";

            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) {
                    htmlResult += "<br>";
                    return;
                }
                const isDialogue = /^["'『「].*["'』｣]$/.test(trimmed) || trimmed.includes('이 말했다') || trimmed.includes('아뢰었다');

                if (isDialogue) {
                    htmlResult += `<div class="novel-paragraph dialogue-line">${line}</div>`;
                } else {
                    htmlResult += `<div class="novel-paragraph">${line}</div>`;
                }
            });

            viewer.innerHTML = htmlResult;
        }

        document.getElementById('fileInput').addEventListener('change', (e) => loadTextFile(e.target.files[0]));
        document.getElementById('fileInput2').addEventListener('change', (e) => { loadTextFile(e.target.files[0]); e.target.value = ''; });
        window.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-active'); });
        window.addEventListener('dragleave', (e) => { e.preventDefault(); dropzone.classList.remove('drag-active'); });
        window.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('drag-active'); if (e.dataTransfer.files.length > 0) loadTextFile(e.dataTransfer.files[0]); });

        // ① 기존 시스템 꺾쇠 태그 삭제 함수
        function cleanSystemTags() {
            if (!rawText) return;
            let text = viewer.innerText;
            text = text.replace(/<[^>]+>/g, ""); // <...> 형태 전부 삭제
            text = text.replace(/\n\s*\n\s*\n/g, "\n\n"); 
            parseAndRenderText(text);
            alert("이미지 및 시스템 특수 태그(< >)가 모두 제거되었습니다.");
        }

        // ② 🌟 새로 추가된 히든 스토리/스포일러 블록 삭제 함수
        function cleanHiddenStory() {
            if (!rawText) return;
            let text = viewer.innerText;

            // 규칙 1: ![캐릭터]@ [표정:...][내면:...] 형태의 대괄호 블록 체인 삭제
            // (줄바꿈이 섞여 있어도 잡아내도록 설정)
            text = text.replace(/!\[[\s\S]*?\]@\s*(?:\[[\s\S]*?\]\s*)+/g, "");

            // 규칙 2: @Hidden Spoiler@ 부터 @END@ 까지의 블록 전체 삭제
            text = text.replace(/@Hidden\s+Spoiler@[\s\S]*?@END@/gi, "");

            // 불필요하게 늘어난 빈 줄 압축
            text = text.replace(/\n\s*\n\s*\n/g, "\n\n"); 

            parseAndRenderText(text);
            alert("히든 스토리 및 스포일러 설정 블록이 깔끔하게 삭제되었습니다.");
        }

        function addRuleRow() {
            const container = document.getElementById('rulesList');
            const row = document.createElement('div');
            row.className = 'rule-row';
            row.innerHTML = `<input type="text" class="rule-find" placeholder="찾을 단어"><span style="align-self:center; font-size:11px;">→</span><input type="text" class="rule-replace" placeholder="(공백이면 삭제)"><button class="btn-del-rule" onclick="this.parentElement.remove()">X</button>`;
            container.appendChild(row);
        }

        function applyCustomRules() {
            let currentText = viewer.innerText;
            const findInputs = document.querySelectorAll('.rule-find');
            const replaceInputs = document.querySelectorAll('.rule-replace');
            let count = 0;

            for (let i = 0; i < findInputs.length; i++) {
                let findTarget = findInputs[i].value;
                let replaceValue = replaceInputs[i].value;
                if (findTarget) {
                    let escapedTarget = findTarget.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                    let regex = new RegExp(escapedTarget, 'g');
                    currentText = currentText.replace(regex, replaceValue);
                    count++;
                }
            }
            if (count === 0) return alert("입력된 규칙이 없습니다.");
            parseAndRenderText(currentText);
            alert("치환 규칙이 적용되었습니다!");
        }

        function changeTheme(theme) { document.body.className = ''; if (theme !== 'paper') document.body.classList.add('theme-' + theme); }
        function adjustFontSize(value) { currentFontSize += value; if (currentFontSize < 12) currentFontSize = 12; if (currentFontSize > 28) currentFontSize = 28; viewer.style.fontSize = currentFontSize + 'px'; }
    </script>
</body>
</html>
