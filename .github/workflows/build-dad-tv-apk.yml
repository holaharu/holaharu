name: Build Dad TV APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dad-tv-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dad-tv-debug-apk
          path: dad-tv-app/app/build/outputs/apk/debug/app-debug.apk
