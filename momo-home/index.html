<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>모모네 집</title>
<style>
html,body{margin:0;min-height:100%;background:#f7f0df}body{display:grid;place-items:center;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.stage{position:relative;width:min(100vw,1648px);line-height:0}.stage>img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;display:block;z-index:2;border-radius:7%;cursor:pointer;-webkit-tap-highlight-color:transparent}.hotspot:focus-visible{outline:4px solid rgba(255,255,255,.95);outline-offset:-4px}.file-zone{left:10.5%;top:14%;width:40.5%;height:40.5%}.ledger-zone{left:54%;top:8%;width:36.5%;height:46.5%}@media(hover:hover){.hotspot:hover{background:rgba(255,255,255,.05)}}
</style>
</head>
<body>
<main class="stage" aria-label="모모네 집 바로가기">
  <img src="momo-house.png" alt="모모네 집 정원. 왼쪽은 파일정리 당근밭, 오른쪽은 월별가계부 사과나무 밭, 아래 여행정리는 준비 중입니다." />
  <a class="hotspot file-zone" href="https://holaharu.github.io/holaharu/momo-household/" aria-label="파일정리로 이동" title="파일정리"></a>
  <a class="hotspot ledger-zone" href="https://script.google.com/macros/s/AKfycbz5YzkvmMvAzPvbV-YOwo0FLwXb7m3hsymJ8yCqXvCS71XnRXiC8ZnzNHFR4dZeDioZYQ/exec" aria-label="월별가계부로 이동" title="월별가계부"></a>
</main>
</body>
</html>
