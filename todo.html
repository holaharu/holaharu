<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘의 체크리스트</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f1e8;color:#40372f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:680px;margin:auto;padding:34px 18px 80px}header{background:#fffaf2;border:1px solid #eadfce;border-radius:24px;padding:25px;box-shadow:0 8px 28px #6e5d4620;margin-bottom:18px}h1{margin:0;font-size:27px}.date{margin-top:7px;color:#9b8068}.progress{margin-top:18px;height:10px;background:#eadfce;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#9c8064;transition:.25s}.count{font-size:12px;color:#8a7461;margin-top:7px;text-align:right}.section{background:#fff;border:1px solid #eee2d3;border-radius:20px;padding:18px;margin:14px 0}.section h2{font-size:17px;margin:0 0 11px}.item{display:flex;align-items:flex-start;gap:11px;padding:10px 5px;border-bottom:1px dashed #eee5da}.item:last-child{border:0}.item input{width:20px;height:20px;accent-color:#907258;flex:none}.item label{line-height:1.45;cursor:pointer}.item.done label{text-decoration:line-through;color:#aaa}.sub{font-size:12px;color:#a18e7e}.addbox{display:flex;gap:8px;margin-top:18px}.addbox input,.addbox select{border:1px solid #ddcfbd;border-radius:12px;padding:12px;background:white;min-width:0}.addbox input{flex:1}.addbox button{border:0;background:#55483c;color:white;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}.reset{display:block;margin:25px auto 0;border:0;background:none;color:#b2a08e;text-decoration:underline;cursor:pointer}@media(max-width:520px){.wrap{padding-top:20px}.addbox{flex-wrap:wrap}.addbox input{flex-basis:100%}.addbox select{flex:1}.addbox button{padding:12px 18px}}</style></head><body><div class="wrap"><header><h1>10월 1일 · 오늘의 체크리스트</h1><div class="date">하나씩 지워버리면 되는 것이와요.</div><div class="progress"><div class="bar" id="bar"></div></div><div class="count" id="count"></div></header><main id="app"></main><div class="section"><h2>＋ 깜빡한 일 추가</h2><div class="addbox"><input id="newTask" placeholder="새 할 일을 적어주시와요"><select id="cat"></select><button id="add">추가</button></div></div><button class="reset" id="reset">오늘 체크 상태 초기화</button></div><script>const defaults={"회사 일":["통장 정리","퇴직자 2명 퇴직금 계산","퇴직 신고 처리"],"학은제 · 총 12강":["과목 1 — ①강 / ②강","과목 2 — ①강 / ②강","과목 3 — ①강 / ②강","과목 4 — ①강 / ②강","과목 5 — ①강 / ②강","과목 6 — ①강 / ②강"],"한능검":["시험용 사진 업로드","선사~고려 전체 복습","복습 후 문제 풀기","틀린 문제 체크"],"가계부 & 여행 정산":["9월 가계부 정리","9월 가계부 업로드","8월 일본여행 정산","일본여행 정산 업로드"],"살 것":["푸드올로지 유산균 구매","엄마 멜라토닌 구매"],"생활":["개 산책","수영 가기"]};const key='haru-todo-2026-10-01';let data=JSON.parse(localStorage.getItem(key)||'null')||Object.entries(defaults).flatMap(([cat,a])=>a.map(text=>({cat,text,done:false})));const cats=[...Object.keys(defaults),'기타'];const app=document.getElementById('app'),sel=document.getElementById('cat');sel.innerHTML=cats.map(x=>`<option>${x}</option>`).join('');function save(){localStorage.setItem(key,JSON.stringify(data))}function render(){app.innerHTML='';cats.forEach(c=>{const arr=data.map((x,i)=>({...x,i})).filter(x=>x.cat===c);if(!arr.length)return;const s=document.createElement('section');s.className='section';s.innerHTML=`<h2>${c}</h2>`;arr.forEach(x=>{const d=document.createElement('div');d.className='item'+(x.done?' done':'');d.innerHTML=`<input type="checkbox" ${x.done?'checked':''}><label>${x.text}</label>`;d.querySelector('input').onchange=e=>{data[x.i].done=e.target.checked;save();render()};s.appendChild(d)});app.appendChild(s)});const done=data.filter(x=>x.done).length,total=data.length;document.getElementById('bar').style.width=(total?done/total*100:0)+'%';document.getElementById('count').textContent=`${done} / ${total} 완료`;}function add(){const i=document.getElementById('newTask');if(!i.value.trim())return;data.push({cat:sel.value,text:i.value.trim(),done:false});i.value='';save();render()}document.getElementById('add').onclick=add;document.getElementById('newTask').onkeydown=e=>{if(e.key==='Enter')add()};document.getElementById('reset').onclick=()=>{if(confirm('체크한 내용을 모두 해제할까요?')){data.forEach(x=>x.done=false);save();render()}};render();</script></body></html>
